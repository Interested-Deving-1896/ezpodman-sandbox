---
# group_vars/all.yml — vars applied to every host, including localhost.
#
# 'incus_remote' selects which Incus server to target. It has no default —
# you must pass it explicitly on every run:
#
#   ansible-playbook playbooks/provision.yml -e "incus_remote=<remote>"
#
# See available remotes: incus remote list
# Add a new remote:      incus remote add <remote> https://<your-server>:8443 --accept-certificate

incus_project: ezpodman-sandbox

# community.general.incus connection plugin reads these two variables.
# default('') prevents a cryptic Jinja2 parse error when incus_remote is
# not set — the assert in each playbook will catch it with a clear message.
ansible_incus_remote: "{{ incus_remote | default('') }}"
ansible_incus_project: "{{ incus_project }}"
