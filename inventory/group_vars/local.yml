---
# group_vars/local.yml — vars for ezpodman-local (Fedora, local/main role).
# Applied automatically to hosts in the [local] group.

# Software installed by setup.yml on this VM:
#   curl, podman, docker, ezpodman, lazydocker, git, go, ssh, jq, fzf
#
# This VM initiates remote Podman connections to podman-remote over SSH —
# that SSH key must be provisioned manually (see CLAUDE.md prerequisites).

# Test containers started by containers_up.yml.
# Rootless — ports below 1024 require extra kernel caps, so we use high ports.
containers:
  - name: nginx
    image: docker.io/library/nginx:alpine
    ports: ["8080:80"]

  - name: caddy
    image: docker.io/library/caddy:alpine
    ports: ["8081:80"]
