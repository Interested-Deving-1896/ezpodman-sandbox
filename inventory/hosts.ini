# inventory/hosts.ini
#
# VMs live inside the Incus project 'ezpodman-sandbox'.
# Ansible reaches them via the community.general.incus connection plugin,
# which runs: incus exec <remote>:<vm> --project <project> -- /bin/sh -c ...
#
# Connection variables (ansible_incus_remote, ansible_incus_project) come
# from group_vars/all.yml. Override the remote at runtime:
#   ansible-playbook setup.yml -e "incus_remote=falcon"

[local]
ezpodman-local

[remote]
podman-remote

[all:vars]
# Use the Incus connection plugin for all VMs (not SSH).
# The plugin shells into instances via `incus exec` — no network port needed.
ansible_connection=community.general.incus
