---
# roles/podman_setup/defaults/main.yml
#
# 'defaults' has the lowest variable precedence — override with group_vars,
# host_vars, or -e without any special effort.

# The non-root user that runs Podman rootlessly.
# Created by this role if it doesn't exist.
# All containers, sockets, and toolchain binaries belong to this user.
sandbox_user: podman

# Password for sandbox_user on podman-remote.
# Needed so ezpodman can run 'ssh-copy-id podman@podman-remote' to push its
# SSH key — that's the feature being tested. This is a sandbox-only credential.
sandbox_user_password: podman
