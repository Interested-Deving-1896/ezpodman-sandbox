---
# roles/podman_setup/tasks/main.yml
#
# Installs Podman and configures it for rootless use.
# Runs on: all VMs (ezpodman-local + podman-remote).
# The OS-specific sections are gated on ansible_facts['os_family'], which Ansible
# detects during gather_facts at the top of setup.yml.

# ── 1. Install Podman ────────────────────────────────────────────────────────

# Fedora ships Podman in its default repos — no extra repo needed.
- name: Install Podman (Fedora/RedHat)
  ansible.builtin.dnf:
    name: podman
    state: present
  when: ansible_facts['os_family'] == "RedHat"

# Debian 13 (Trixie) ships a recent Podman in main — no backports needed.
- name: Update apt cache (Debian)
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600   # skip if cache is less than 1 hour old
  when: ansible_facts['os_family'] == "Debian"

- name: Install Podman (Debian)
  ansible.builtin.apt:
    name: podman
    state: present
  when: ansible_facts['os_family'] == "Debian"

# openssh-server is not included in the Debian Trixie minimal Incus image.
# ezpodman connects from ezpodman-local to podman-remote over SSH to manage
# containers remotely — sshd must be running for that to work.
# Only needed on podman-remote (the [remote] group); ezpodman-local is the client.
# Note: Debian names the service 'ssh', not 'sshd'.
- name: Install openssh-server (podman-remote)
  ansible.builtin.apt:
    name: openssh-server
    state: present
  when:
    - ansible_facts['os_family'] == "Debian"
    - inventory_hostname in groups['remote']

- name: Enable and start sshd (podman-remote)
  ansible.builtin.systemd:
    name: ssh
    state: started
    enabled: true
  when: inventory_hostname in groups['remote']

# ── 2. Create sandbox user ───────────────────────────────────────────────────

# Rootless Podman requires a real (non-root) user with entries in
# /etc/subuid and /etc/subgid for user namespace mapping.
# Modern useradd (shadow-utils ≥ 4.8) auto-populates subuid/subgid on
# user creation, so we don't need to manage those files manually.
- name: Create sandbox user '{{ sandbox_user }}'
  ansible.builtin.user:
    name: "{{ sandbox_user }}"
    comment: "Rootless Podman sandbox user"
    shell: /bin/bash
    # create_home ensures ~/.config and ~/.local are writable for user services
    create_home: true
    state: present
    # Set a password on podman-remote so ezpodman can run 'ssh-copy-id' to
    # push its SSH key — testing that flow is the point of the sandbox.
    # password_hash('sha512') produces the /etc/shadow-compatible hash.
    # Only set on podman-remote; ezpodman-local is the initiating side.
    password: "{{ (sandbox_user_password | password_hash('sha512')) if inventory_hostname in groups['remote'] else omit }}"
  register: sandbox_user_info

# ── 3. Enable lingering ──────────────────────────────────────────────────────

# 'loginctl enable-linger' tells systemd to start the user's session manager
# at boot and keep it running even when no one is logged in. Without this,
# podman.socket (and any user-level systemd units) would only be active
# while the user has an open session — useless for a headless VM.
- name: Enable lingering for '{{ sandbox_user }}'
  ansible.builtin.command:
    cmd: loginctl enable-linger {{ sandbox_user }}
  changed_when: false   # loginctl enable-linger is idempotent; suppress noise

# ── 4. Enable podman.socket (podman-remote only) ─────────────────────────────

# podman.socket is the systemd user unit that activates the Podman REST API
# on demand. It is needed on both VMs:
#   - ezpodman-local: ezpodman checks for the local socket at startup
#     (/run/user/<UID>/podman/podman.sock) and enables lazydocker locally.
#   - podman-remote: ezpodman-local connects to this socket over an SSH tunnel
#     to manage remote containers.
#
# XDG_RUNTIME_DIR tells systemd where the user's runtime directory is
# (where the socket lives). Its path is /run/user/<UID>.
# systemctl --user needs two env vars to communicate with the user's systemd:
#   XDG_RUNTIME_DIR  — path to the user's runtime dir (/run/user/<UID>)
#   DBUS_SESSION_BUS_ADDRESS — path to the user's D-Bus socket (also under XDG_RUNTIME_DIR)
# Ansible's systemd module with scope:user doesn't set these automatically when
# using become_user, so we fall back to the command module and set them explicitly.
# Lingering (enabled above) ensures the user bus socket exists at boot even
# without an active login session.
- name: Enable and start podman.socket for '{{ sandbox_user }}'
  ansible.builtin.command:
    cmd: systemctl --user enable --now podman.socket
  become: true
  become_user: "{{ sandbox_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ sandbox_user_info.uid }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ sandbox_user_info.uid }}/bus"
  changed_when: false

# ── 5. Smoke-test ────────────────────────────────────────────────────────────

# Confirm Podman can run a container rootlessly. This catches subuid/subgid
# misconfigurations or missing kernel features before the containers_up play.
# 'podman run --rm' pulls the image, runs it, and removes the container.
# '--network none' avoids DNS issues in the Incus-internal network.
- name: Smoke-test rootless Podman ('podman run --rm hello-world')
  ansible.builtin.command:
    cmd: podman run --rm --network none docker.io/hello-world
  become: true
  become_user: "{{ sandbox_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ sandbox_user_info.uid }}"
  register: podman_smoke
  changed_when: false
  failed_when: "'Hello from Docker!' not in podman_smoke.stdout"
